services:
  - type: worker
    name: fb-leads-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FB_EMAIL
        sync: false
      - key: FB_PASSWORD
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INTERVAL_MINUTES
        value: "10"
